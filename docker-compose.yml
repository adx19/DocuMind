services:
  backend:
    build:
      context: ./backend
    container_name: documind-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: documind-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy